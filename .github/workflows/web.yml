name: Web and GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'landing/**', '.github/workflows/web.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', 'landing/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run lint && npm run build:pages
        working-directory: web
      - name: Assemble website from the same web sources
        run: |
          mkdir -p _site/app
          cp -R landing/. _site/
          cp -R web/dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
